<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', sans-serif; fill: #1f2937; }
      .label { font: 600 18px 'Segoe UI', sans-serif; fill: #111827; }
      .small { font: 500 15px 'Segoe UI', sans-serif; fill: #374151; }
      .actor { fill: #f3f4f6; stroke: #111827; stroke-width: 2; }
      .system { fill: #ffffff; stroke: #111827; stroke-width: 2.5; }
      .usecase { fill: #ecfeff; stroke: #0e7490; stroke-width: 2; }
      .future { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; stroke-dasharray: 8 6; }
      .line { stroke: #4b5563; stroke-width: 2; fill: none; }
      .include { stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#f8fafc" />
  <text x="700" y="55" text-anchor="middle" class="title">筋トレ管理アプリ ユースケース図</text>

  <!-- Actor -->
  <circle cx="130" cy="180" r="35" class="actor" />
  <line x1="130" y1="215" x2="130" y2="320" class="line" />
  <line x1="75" y1="250" x2="185" y2="250" class="line" />
  <line x1="130" y1="320" x2="80" y2="390" class="line" />
  <line x1="130" y1="320" x2="180" y2="390" class="line" />
  <text x="130" y="430" text-anchor="middle" class="label">利用者</text>

  <!-- System boundary -->
  <rect x="260" y="90" width="1090" height="760" rx="16" class="system" />
  <text x="300" y="130" class="label">筋トレ管理アプリ</text>

  <!-- Implemented use cases -->
  <ellipse cx="560" cy="220" rx="170" ry="42" class="usecase" />
  <text x="560" y="227" text-anchor="middle" class="small">ヘルスチェック確認</text>

  <ellipse cx="560" cy="320" rx="190" ry="42" class="usecase" />
  <text x="560" y="327" text-anchor="middle" class="small">メニューグループ一覧を見る</text>

  <ellipse cx="560" cy="420" rx="190" ry="42" class="usecase" />
  <text x="560" y="427" text-anchor="middle" class="small">メニューグループを作成する</text>

  <ellipse cx="560" cy="520" rx="190" ry="42" class="usecase" />
  <text x="560" y="527" text-anchor="middle" class="small">メニューグループ名を更新する</text>

  <ellipse cx="560" cy="620" rx="210" ry="42" class="usecase" />
  <text x="560" y="627" text-anchor="middle" class="small">メニューグループを削除する（論理削除）</text>

  <ellipse cx="980" cy="620" rx="180" ry="38" class="usecase" />
  <text x="980" y="627" text-anchor="middle" class="small">削除済みを一覧から除外する</text>

  <!-- Future use cases -->
  <ellipse cx="980" cy="260" rx="165" ry="38" class="future" />
  <text x="980" y="267" text-anchor="middle" class="small">種目を登録する（次フェーズ）</text>

  <ellipse cx="980" cy="360" rx="190" ry="40" class="future" />
  <text x="980" y="367" text-anchor="middle" class="small">トレーニング記録を入力する（次フェーズ）</text>

  <ellipse cx="980" cy="460" rx="170" ry="38" class="future" />
  <text x="980" y="467" text-anchor="middle" class="small">履歴を確認する（次フェーズ）</text>

  <ellipse cx="980" cy="540" rx="170" ry="38" class="future" />
  <text x="980" y="547" text-anchor="middle" class="small">成長グラフを見る（次フェーズ）</text>

  <ellipse cx="1240" cy="330" rx="120" ry="32" class="future" />
  <text x="1240" y="336" text-anchor="middle" class="small">種目を選ぶ</text>

  <ellipse cx="1240" cy="392" rx="120" ry="32" class="future" />
  <text x="1240" y="398" text-anchor="middle" class="small">セットを入力する</text>

  <!-- Actor associations -->
  <line x1="195" y1="250" x2="390" y2="220" class="line" />
  <line x1="195" y1="260" x2="370" y2="320" class="line" />
  <line x1="195" y1="280" x2="370" y2="420" class="line" />
  <line x1="195" y1="300" x2="370" y2="520" class="line" />
  <line x1="195" y1="320" x2="350" y2="620" class="line" />
  <line x1="195" y1="265" x2="815" y2="260" class="line" />
  <line x1="195" y1="285" x2="790" y2="360" class="line" />
  <line x1="195" y1="305" x2="810" y2="460" class="line" />
  <line x1="195" y1="325" x2="810" y2="540" class="line" />

  <!-- include relations -->
  <line x1="790" y1="360" x2="1120" y2="330" class="include" marker-end="url(#arrow)" />
  <text x="940" y="332" class="small" fill="#7c3aed">&lt;&lt;include&gt;&gt;</text>

  <line x1="790" y1="370" x2="1120" y2="392" class="include" marker-end="url(#arrow)" />
  <text x="940" y="390" class="small" fill="#7c3aed">&lt;&lt;include&gt;&gt;</text>

  <line x1="770" y1="620" x2="800" y2="620" class="include" marker-end="url(#arrow)" />
  <text x="780" y="607" class="small" fill="#7c3aed">&lt;&lt;include&gt;&gt;</text>

  <!-- Legend -->
  <rect x="280" y="760" width="22" height="22" class="usecase" />
  <text x="312" y="776" class="small">実装済みユースケース</text>

  <rect x="530" y="760" width="22" height="22" class="future" />
  <text x="562" y="776" class="small">次フェーズのユースケース</text>
</svg>

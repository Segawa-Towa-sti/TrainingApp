<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #0f172a; }
      .laneTitle { font: 700 18px 'Segoe UI', sans-serif; fill: #0f172a; }
      .text { font: 600 15px 'Segoe UI', sans-serif; fill: #111827; }
      .small { font: 500 13px 'Segoe UI', sans-serif; fill: #374151; }
      .swimlane { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .action { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 12; }
      .decision { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .start { fill: #0f172a; }
      .end { fill: #0f172a; }
      .end-inner { fill: #ffffff; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; }
      .error { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 12; }
      .ok { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 12; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="980" class="bg"/>
  <text x="750" y="52" text-anchor="middle" class="title">アクティビティ図: MenuGroup API 処理フロー</text>

  <!-- Swimlanes -->
  <rect x="80" y="90" width="1340" height="820" class="swimlane"/>
  <line x1="520" y1="90" x2="520" y2="910" class="line"/>
  <line x1="960" y1="90" x2="960" y2="910" class="line"/>

  <text x="300" y="120" text-anchor="middle" class="laneTitle">クライアント</text>
  <text x="740" y="120" text-anchor="middle" class="laneTitle">Express ルーター</text>
  <text x="1185" y="120" text-anchor="middle" class="laneTitle">Prisma / PostgreSQL</text>

  <!-- Start -->
  <circle cx="300" cy="170" r="12" class="start"/>

  <!-- Request method choice -->
  <rect x="210" y="210" width="180" height="56" class="action"/>
  <text x="300" y="243" text-anchor="middle" class="text">APIを呼び出す</text>

  <polygon points="300,300 380,360 300,420 220,360" class="decision"/>
  <text x="300" y="365" text-anchor="middle" class="text">HTTPメソッド?</text>

  <!-- GET path -->
  <rect x="560" y="250" width="260" height="56" class="action"/>
  <text x="690" y="283" text-anchor="middle" class="text">GET /menu-groups</text>

  <rect x="1010" y="250" width="350" height="70" class="action"/>
  <text x="1185" y="278" text-anchor="middle" class="text">findMany(where: deletedAt = null,</text>
  <text x="1185" y="298" text-anchor="middle" class="text">orderBy: id asc)</text>

  <rect x="560" y="338" width="260" height="56" class="ok"/>
  <text x="690" y="372" text-anchor="middle" class="text">200 + 配列JSONを返す</text>

  <!-- POST path -->
  <rect x="560" y="430" width="260" height="56" class="action"/>
  <text x="690" y="463" text-anchor="middle" class="text">POST /menu-groups</text>

  <polygon points="690,512 760,562 690,612 620,562" class="decision"/>
  <text x="690" y="558" text-anchor="middle" class="text">nameは有効?</text>

  <rect x="560" y="638" width="260" height="56" class="error"/>
  <text x="690" y="672" text-anchor="middle" class="text">400 を返す</text>

  <rect x="1010" y="530" width="350" height="70" class="action"/>
  <text x="1185" y="558" text-anchor="middle" class="text">create({ userId: 1, name: trimmedName })</text>
  <text x="1185" y="578" text-anchor="middle" class="small">(外部キー制約を満たす必要あり)</text>

  <rect x="560" y="730" width="260" height="56" class="ok"/>
  <text x="690" y="764" text-anchor="middle" class="text">201 + 作成データを返す</text>

  <!-- PATCH/DELETE summary -->
  <rect x="560" y="816" width="260" height="56" class="action"/>
  <text x="690" y="844" text-anchor="middle" class="text">PATCH / DELETE</text>
  <text x="690" y="862" text-anchor="middle" class="small">id検証 → 存在確認 → update</text>

  <rect x="1010" y="804" width="350" height="72" class="action"/>
  <text x="1185" y="832" text-anchor="middle" class="text">PATCH: name更新</text>
  <text x="1185" y="852" text-anchor="middle" class="text">DELETE: deletedAt に現在時刻を設定</text>

  <!-- End -->
  <circle cx="300" cy="884" r="14" class="end"/>
  <circle cx="300" cy="884" r="7" class="end-inner"/>

  <!-- Arrows general -->
  <line x1="300" y1="182" x2="300" y2="210" class="line" marker-end="url(#arrow)"/>
  <line x1="300" y1="266" x2="300" y2="300" class="line" marker-end="url(#arrow)"/>

  <!-- decision branches from method -->
  <line x1="380" y1="360" x2="560" y2="278" class="line" marker-end="url(#arrow)"/>
  <text x="470" y="305" class="small">GET</text>

  <line x1="300" y1="420" x2="300" y2="458" class="line" marker-end="url(#arrow)"/>
  <line x1="300" y1="458" x2="560" y2="458" class="line" marker-end="url(#arrow)"/>
  <text x="420" y="446" class="small">POST</text>

  <line x1="220" y1="360" x2="170" y2="360" class="line"/>
  <line x1="170" y1="360" x2="170" y2="844" class="line"/>
  <line x1="170" y1="844" x2="560" y2="844" class="line" marker-end="url(#arrow)"/>
  <text x="180" y="380" class="small">PATCH/DELETE</text>

  <!-- GET flow arrows -->
  <line x1="820" y1="278" x2="1010" y2="278" class="line" marker-end="url(#arrow)"/>
  <line x1="1010" y1="330" x2="820" y2="366" class="line" marker-end="url(#arrow)"/>

  <!-- POST flow arrows -->
  <line x1="690" y1="486" x2="690" y2="512" class="line" marker-end="url(#arrow)"/>

  <line x1="620" y1="562" x2="560" y2="562" class="line"/>
  <line x1="560" y1="562" x2="560" y2="666" class="line" marker-end="url(#arrow)"/>
  <text x="570" y="548" class="small">No</text>

  <line x1="760" y1="562" x2="1010" y2="562" class="line" marker-end="url(#arrow)"/>
  <text x="875" y="548" class="small">Yes</text>

  <line x1="1010" y1="620" x2="820" y2="758" class="line" marker-end="url(#arrow)"/>

  <!-- merge to end -->
  <line x1="690" y1="694" x2="690" y2="884" class="line"/>
  <line x1="690" y1="884" x2="314" y2="884" class="line" marker-end="url(#arrow)"/>

  <line x1="690" y1="786" x2="690" y2="884" class="line"/>
  <line x1="690" y1="872" x2="690" y2="884" class="line"/>

  <line x1="820" y1="366" x2="900" y2="366" class="line"/>
  <line x1="900" y1="366" x2="900" y2="884" class="line"/>
  <line x1="900" y1="884" x2="314" y2="884" class="line" marker-end="url(#arrow)"/>

  <line x1="820" y1="844" x2="1010" y2="840" class="line" marker-end="url(#arrow)"/>
  <line x1="1010" y1="878" x2="314" y2="884" class="line" marker-end="url(#arrow)"/>

  <!-- legend -->
  <rect x="1060" y="146" width="22" height="22" class="action"/>
  <text x="1092" y="162" class="small">処理</text>
  <polygon points="1160,168 1180,184 1160,200 1140,184" class="decision"/>
  <text x="1190" y="187" class="small">分岐</text>
  <rect x="1260" y="146" width="22" height="22" class="error"/>
  <text x="1292" y="162" class="small">エラー応答</text>
  <rect x="1360" y="146" width="22" height="22" class="ok"/>
  <text x="1392" y="162" class="small">成功応答</text>
</svg>

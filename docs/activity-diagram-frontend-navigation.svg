<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 30px 'Segoe UI', sans-serif; fill: #0f172a; }
      .laneTitle { font: 700 18px 'Segoe UI', sans-serif; fill: #0f172a; }
      .text { font: 600 15px 'Segoe UI', sans-serif; fill: #111827; }
      .small { font: 500 13px 'Segoe UI', sans-serif; fill: #374151; }
      .swimlane { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .action { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 12; }
      .screen { fill: #eef2ff; stroke: #4338ca; stroke-width: 2.2; rx: 12; }
      .decision { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; }
      .api { fill: #ecfdf5; stroke: #16a34a; stroke-width: 2; rx: 12; }
      .db { fill: #fefce8; stroke: #a16207; stroke-width: 2; rx: 12; }
      .error { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 12; }
      .line { stroke: #475569; stroke-width: 2.2; fill: none; }
      .dashed { stroke: #7c3aed; stroke-width: 2; stroke-dasharray: 7 6; fill: none; }
      .start { fill: #0f172a; }
      .endOuter { fill: #0f172a; }
      .endInner { fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#475569" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 z" fill="#7c3aed" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="1080" class="bg"/>
  <text x="840" y="52" text-anchor="middle" class="title">アクティビティ図: フロント操作込み（画面遷移あり）</text>

  <!-- Swimlanes -->
  <rect x="70" y="90" width="1540" height="920" class="swimlane"/>
  <line x1="430" y1="90" x2="430" y2="1010" class="line"/>
  <line x1="980" y1="90" x2="980" y2="1010" class="line"/>
  <line x1="1320" y1="90" x2="1320" y2="1010" class="line"/>

  <text x="250" y="120" text-anchor="middle" class="laneTitle">利用者</text>
  <text x="705" y="120" text-anchor="middle" class="laneTitle">フロントエンド（React画面）</text>
  <text x="1150" y="120" text-anchor="middle" class="laneTitle">バックエンドAPI（Express）</text>
  <text x="1465" y="120" text-anchor="middle" class="laneTitle">DB（Prisma/PostgreSQL）</text>

  <!-- Start -->
  <circle cx="250" cy="165" r="12" class="start"/>

  <!-- Home screen -->
  <rect x="520" y="145" width="370" height="62" class="screen"/>
  <text x="705" y="173" text-anchor="middle" class="text">S-01 ホーム画面を表示</text>
  <text x="705" y="193" text-anchor="middle" class="small">入力エリア + 直近グラフ</text>

  <rect x="120" y="240" width="260" height="56" class="action"/>
  <text x="250" y="273" text-anchor="middle" class="text">記録開始ボタンを押す</text>

  <rect x="520" y="240" width="370" height="56" class="screen"/>
  <text x="705" y="273" text-anchor="middle" class="text">メニューグループ一覧を要求</text>

  <rect x="1030" y="240" width="240" height="56" class="api"/>
  <text x="1150" y="273" text-anchor="middle" class="text">GET /menu-groups</text>

  <rect x="1350" y="240" width="230" height="56" class="db"/>
  <text x="1465" y="273" text-anchor="middle" class="text">未削除データを検索</text>

  <rect x="520" y="325" width="370" height="56" class="screen"/>
  <text x="705" y="358" text-anchor="middle" class="text">メニューグループ一覧を表示</text>

  <rect x="120" y="325" width="260" height="56" class="action"/>
  <text x="250" y="358" text-anchor="middle" class="text">メニューグループを選択</text>

  <rect x="120" y="410" width="260" height="56" class="action"/>
  <text x="250" y="443" text-anchor="middle" class="text">種目とセット数を入力</text>

  <rect x="520" y="410" width="370" height="56" class="screen"/>
  <text x="705" y="443" text-anchor="middle" class="text">入力フォームを段階表示</text>

  <!-- Create menu group branch -->
  <polygon points="250,535 340,595 250,655 160,595" class="decision"/>
  <text x="250" y="600" text-anchor="middle" class="text">新規グループ
作成する?</text>

  <rect x="520" y="540" width="370" height="56" class="screen"/>
  <text x="705" y="573" text-anchor="middle" class="text">新規グループ名入力フォーム</text>

  <rect x="1030" y="540" width="240" height="56" class="api"/>
  <text x="1150" y="573" text-anchor="middle" class="text">POST /menu-groups</text>

  <rect x="1350" y="540" width="230" height="56" class="db"/>
  <text x="1465" y="573" text-anchor="middle" class="text">MenuGroupを作成</text>

  <rect x="520" y="620" width="370" height="56" class="screen"/>
  <text x="705" y="653" text-anchor="middle" class="text">一覧を再取得して再描画</text>

  <!-- Error branch for POST -->
  <rect x="1030" y="620" width="240" height="56" class="error"/>
  <text x="1150" y="653" text-anchor="middle" class="text">400 バリデーションエラー</text>

  <rect x="520" y="700" width="370" height="56" class="error"/>
  <text x="705" y="733" text-anchor="middle" class="text">エラーメッセージを表示</text>

  <!-- Navigation to other screens -->
  <polygon points="250,760 340,820 250,880 160,820" class="decision"/>
  <text x="250" y="825" text-anchor="middle" class="text">どの画面へ
遷移する?</text>

  <rect x="520" y="780" width="250" height="56" class="screen"/>
  <text x="645" y="813" text-anchor="middle" class="text">S-02 記録一覧画面</text>

  <rect x="800" y="780" width="250" height="56" class="screen"/>
  <text x="925" y="813" text-anchor="middle" class="text">S-03 詳細グラフ画面</text>

  <rect x="1080" y="780" width="250" height="56" class="screen"/>
  <text x="1205" y="813" text-anchor="middle" class="text">S-04 種目管理画面</text>

  <rect x="520" y="870" width="810" height="64" class="screen"/>
  <text x="925" y="898" text-anchor="middle" class="text">どの画面からもホームへ戻る（S-01）</text>
  <text x="925" y="918" text-anchor="middle" class="small">ホーム起点の画面遷移設計</text>

  <!-- End -->
  <circle cx="250" cy="955" r="14" class="endOuter"/>
  <circle cx="250" cy="955" r="7" class="endInner"/>

  <!-- Main arrows -->
  <line x1="262" y1="165" x2="520" y2="176" class="line" marker-end="url(#arrow)"/>
  <line x1="250" y1="177" x2="250" y2="240" class="line" marker-end="url(#arrow)"/>
  <line x1="380" y1="268" x2="520" y2="268" class="line" marker-end="url(#arrow)"/>
  <line x1="890" y1="268" x2="1030" y2="268" class="line" marker-end="url(#arrow)"/>
  <line x1="1270" y1="268" x2="1350" y2="268" class="line" marker-end="url(#arrow)"/>
  <line x1="1350" y1="296" x2="1270" y2="353" class="line" marker-end="url(#arrow)"/>
  <line x1="1030" y1="353" x2="890" y2="353" class="line" marker-end="url(#arrow)"/>
  <line x1="520" y1="353" x2="380" y2="353" class="line" marker-end="url(#arrow)"/>

  <line x1="250" y1="381" x2="250" y2="410" class="line" marker-end="url(#arrow)"/>
  <line x1="380" y1="438" x2="520" y2="438" class="line" marker-end="url(#arrow)"/>
  <line x1="250" y1="466" x2="250" y2="535" class="line" marker-end="url(#arrow)"/>

  <!-- Decision create group branch -->
  <line x1="340" y1="595" x2="520" y2="568" class="line" marker-end="url(#arrow)"/>
  <text x="430" y="565" class="small">Yes</text>

  <line x1="160" y1="595" x2="120" y2="595" class="line"/>
  <line x1="120" y1="595" x2="120" y2="820" class="line"/>
  <line x1="120" y1="820" x2="160" y2="820" class="line" marker-end="url(#arrow)"/>
  <text x="90" y="610" class="small">No</text>

  <!-- POST flow -->
  <line x1="890" y1="568" x2="1030" y2="568" class="line" marker-end="url(#arrow)"/>
  <line x1="1270" y1="568" x2="1350" y2="568" class="line" marker-end="url(#arrow)"/>
  <line x1="1350" y1="596" x2="1270" y2="648" class="line" marker-end="url(#arrow)"/>
  <line x1="1030" y1="648" x2="890" y2="648" class="line" marker-end="url(#arrow)"/>

  <line x1="1150" y1="596" x2="1150" y2="620" class="dashed" marker-end="url(#arrowPurple)"/>
  <line x1="1030" y1="648" x2="890" y2="728" class="dashed" marker-end="url(#arrowPurple)"/>

  <line x1="705" y1="676" x2="705" y2="820" class="line" marker-end="url(#arrow)"/>
  <line x1="705" y1="756" x2="705" y2="820" class="line" marker-end="url(#arrow)"/>

  <!-- Navigation decision -->
  <line x1="250" y1="655" x2="250" y2="760" class="line" marker-end="url(#arrow)"/>

  <line x1="340" y1="820" x2="520" y2="808" class="line" marker-end="url(#arrow)"/>
  <text x="430" y="804" class="small">一覧へ</text>

  <line x1="340" y1="836" x2="800" y2="808" class="line" marker-end="url(#arrow)"/>
  <text x="570" y="826" class="small">グラフへ</text>

  <line x1="340" y1="852" x2="1080" y2="808" class="line" marker-end="url(#arrow)"/>
  <text x="710" y="846" class="small">種目管理へ</text>

  <line x1="645" y1="836" x2="645" y2="870" class="line" marker-end="url(#arrow)"/>
  <line x1="925" y1="836" x2="925" y2="870" class="line" marker-end="url(#arrow)"/>
  <line x1="1205" y1="836" x2="1205" y2="870" class="line" marker-end="url(#arrow)"/>

  <line x1="520" y1="934" x2="320" y2="955" class="line" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="1130" y="940" width="20" height="20" class="screen"/>
  <text x="1160" y="955" class="small">画面（フロント）</text>

  <rect x="1290" y="940" width="20" height="20" class="api"/>
  <text x="1320" y="955" class="small">API呼び出し</text>

  <rect x="1430" y="940" width="20" height="20" class="db"/>
  <text x="1460" y="955" class="small">DB処理</text>
</svg>
